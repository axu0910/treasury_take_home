[project]
name = "label-verification-backend"
version = "0.1.0"
description = "Local backend for alcohol label verification"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic>=2.8,<3.0",
  "pillow>=10.0,<12.0",
  "opencv-python-headless>=4.10,<5.0",
  "pytesseract>=0.3.13,<1.0",
  "anthropic>=0.69,<1.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
# app.services.rapid_ocr is optional from the app's perspective (see is_available() there) -
# rapidocr-onnxruntime currently caps out at Python <3.13, so it can't be a base dependency
# without breaking installs on a newer interpreter. The Docker image (python:3.11-slim) is
# compatible and installs this extra; see Dockerfile.
rapidocr = ["rapidocr-onnxruntime>=1.3,<2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
